<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560" role="img" aria-labelledby="title description">
  <title id="title">Mycelium — the space between your windows is alive</title>
  <desc id="description">A dark teal graphical banner with an illustrated root network winding around three windows. Decorative artwork, not a desktop capture.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#112c3c"/><stop offset=".6" stop-color="#091820"/><stop offset="1" stop-color="#050d15"/></linearGradient>
    <linearGradient id="sap" x2="1" y2=".5"><stop stop-color="#68efd7"/><stop offset="1" stop-color="#43a9cc"/></linearGradient>
    <radialGradient id="pool"><stop stop-color="#39a9aa" stop-opacity=".22"/><stop offset="1" stop-color="#39a9aa" stop-opacity="0"/></radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5"/></filter>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".8" fill="#98e9df" opacity=".08"/></pattern>
  </defs>
  <rect width="1600" height="560" rx="24" fill="url(#bg)"/>
  <rect width="1600" height="560" rx="24" fill="url(#dots)"/>
  <ellipse cx="1190" cy="282" rx="400" ry="300" fill="url(#pool)"/>
  <g font-family="Inter, Arial, sans-serif">
    <text x="86" y="111" fill="#65dfcf" font-size="14" font-weight="700" letter-spacing="4">OMARCHY / A LIVING WINDOW MAP</text>
    <text x="79" y="226" fill="#effffa" font-size="97" font-weight="800" letter-spacing="-4">MYCELIUM</text>
    <text x="86" y="292" fill="#b8d6de" font-size="29">The space between your windows is alive.</text>
    <text x="86" y="343" fill="#739aa9" font-size="20">Real geometry. Observed focus. Quiet roots.</text>
    <g fill="#112b38" stroke="#315560">
      <rect x="86" y="407" width="169" height="42" rx="21"/><rect x="267" y="407" width="187" height="42" rx="21"/><rect x="466" y="407" width="206" height="42" rx="21"/>
    </g>
    <g fill="#a4e5d9" font-size="12" font-weight="700" letter-spacing="1.4" text-anchor="middle"><text x="170" y="433">NATIVE QML</text><text x="360" y="433">STANDALONE</text><text x="569" y="433">PAGES, NOT SCROLL</text></g>
  </g>
  <g fill="#10202c" stroke="#315262" stroke-width="1.4">
    <rect x="988" y="113" width="218" height="149" rx="13"/><rect x="1244" y="93" width="250" height="171" rx="13"/><rect x="1135" y="333" width="299" height="135" rx="13"/>
  </g>
  <g stroke="#29434f"><path d="M1012 159h169 M1268 139h202 M1159 379h251"/></g>
  <g fill="#658795" font-family="Arial, sans-serif" font-size="11" letter-spacing="3"><text x="1012" y="143">APP / 01</text><text x="1268" y="123">APP / 02</text><text x="1159" y="363">APP / 03</text></g>
  <g fill="none" stroke="url(#sap)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path opacity=".65" filter="url(#glow)" stroke-width="10" d="M927 85v189q0 15 15 15h254q27 0 27 23v172 M974 211v56q0 11 11 11h234q13 0 13-14v-97 M1451 322h-201q-24 0-24-25h280V81 M1054 480v-152q0-26 25-26h79"/>
    <path d="M927 85v189q0 15 15 15h254q27 0 27 23v172 M974 211v56q0 11 11 11h234q13 0 13-14v-97 M1451 322h-201q-24 0-24-25h280V81 M1054 480v-152q0-26 25-26h79"/>
  </g>
  <g fill="none" stroke="#54bfbe" opacity=".48" stroke-width="1.4" stroke-linecap="round">
    <path d="M1045 289q7-20-10-37 M1085 289q5 30-16 37 M1123 289q-13-18 1-34 M1155 302q7 16-4 23 M1223 389q-20-2-22 19 M1506 206q-20 1-23-17 M1226 312q-13 14-20 9"/>
    <circle cx="1223" cy="297" r="28"/><circle cx="1223" cy="297" r="43" opacity=".5"/>
  </g>
  <g fill="#69e8d3"><circle cx="927" cy="85" r="4"/><circle cx="974" cy="211" r="3"/><circle cx="1054" cy="480" r="4"/><circle cx="1451" cy="322" r="4"/></g>
  <circle cx="1506" cy="145" r="5" fill="#e9b66e"/>
  <circle cx="1130" cy="289" r="10" fill="#9ffff0" opacity=".15"/><circle cx="1130" cy="289" r="3.5" fill="#e5fff6"/>
  <rect x="1" y="1" width="1598" height="558" rx="24" fill="none" stroke="#24444f"/>
